# ============================================================================
# PolicyFlow legacy solution — Windows only.
#
# A SEPARATE solution from PolicyFlow.slnx, and kept OUT of the repository root
# so that a bare `dotnet build` at the root is unambiguous.
#
# The legacy Web Forms project targets .NET Framework 4.8 and needs System.Web,
# which exists only on Windows. Including it in the main solution would break
# `dotnet build` and the CI pipeline on any non-Windows machine, and would fail
# on a Windows machine without the .NET Framework 4.8 Developer Pack.
#
# Keeping it here means:
#   * `dotnet build` on PolicyFlow.slnx stays green everywhere.
#   * The CI pipeline does not need a Windows agent.
#   * The legacy project is still a real, openable, buildable project rather
#     than a folder of orphaned files.
#
# Prerequisites to build this solution:
#   * Windows
#   * Visual Studio 2022+ with the "ASP.NET and web development" workload,
#     or MSBuild with the Web Deploy targets
#   * .NET Framework 4.8 Developer Pack (targeting pack)
#     https://dotnet.microsoft.com/download/dotnet-framework/net48
#
# Then:
#   msbuild src\legacy\PolicyFlow.Legacy.sln /p:Configuration=Debug
#
# See docs/LEGACY-MODERNIZATION.md.
# ============================================================================
#
