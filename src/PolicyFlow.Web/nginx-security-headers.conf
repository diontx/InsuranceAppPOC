# =============================================================================
# Security response headers, as an includable snippet.
#
# This is a snippet rather than a single server-level block because of an nginx
# inheritance rule that is easy to get wrong: if a `location` defines ANY
# `add_header`, it discards every `add_header` inherited from the enclosing
# `server`. Setting these once at server level and then adding a Cache-Control
# header inside `location /` silently drops all of them from exactly the
# responses that matter most — the HTML shell.
#
# Including the snippet in every block that adds headers of its own keeps them
# defined in one place and actually present on every response.
# =============================================================================

# Stops a browser second-guessing Content-Type. Without it, a response
# containing markup can be sniffed as HTML and executed.
add_header X-Content-Type-Options "nosniff" always;

# Blocks framing, defeating clickjacking. CSP frame-ancestors below is the
# modern equivalent; this covers older browsers.
add_header X-Frame-Options "DENY" always;

# Sends no referrer cross-origin, so quote ids and policy numbers in a URL do
# not leak to third-party sites.
add_header Referrer-Policy "no-referrer" always;

# Denies device APIs this application has no use for.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# CSP. 'unsafe-inline' is permitted for STYLES only: Vite emits a small inline
# style block and React sets an inline style for the per-carrier brand colour.
# script-src gets no such exemption — it is 'self' only, which is what actually
# blocks injected JavaScript.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
