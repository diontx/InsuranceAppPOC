# =============================================================================
# nginx configuration for the PolicyFlow SPA.
#
# Serves the built React bundle and reverse-proxies /api and /legacy to the API
# container. Proxying rather than calling the API cross-origin means the browser
# makes same-origin requests: no CORS preflight on every call, and no API
# hostname baked into the JavaScript bundle at build time.
# =============================================================================

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version. Free reconnaissance otherwise.
    server_tokens off;

    # Security headers. Included rather than declared inline because a `location`
    # with its own add_header discards every inherited one — see the snippet.
    include /etc/nginx/conf.d/policyflow-security-headers.conf;

    # --- Compression --------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/problem+json image/svg+xml;

    # --- API reverse proxy --------------------------------------------------
    location /api/ {
        include /etc/nginx/conf.d/policyflow-security-headers.conf;

        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Lets the API recover the real client scheme and address. Without these
        # the rate limiter would see every request as coming from this container.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Quote submission returns immediately (202) and the client polls, so no
        # request should ever need a long timeout. A short one surfaces a hung
        # API as an error rather than a spinner that never resolves.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # --- Legacy compatibility seam ------------------------------------------
    # Proxied so the demo can exercise the legacy contract from the same origin.
    location /legacy/ {
        include /etc/nginx/conf.d/policyflow-security-headers.conf;

        proxy_pass         http://api:8080/legacy/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Health and OpenAPI -------------------------------------------------
    location /health/ {
        proxy_pass       http://api:8080/health/;
        proxy_set_header Host $host;
    }

    location /swagger {
        proxy_pass       http://api:8080/swagger;
        proxy_set_header Host $host;
    }

    # --- Static assets ------------------------------------------------------
    # Vite emits content-hashed filenames, so these can be cached indefinitely:
    # a changed file gets a new name rather than a stale cache entry.
    location /assets/ {
        include /etc/nginx/conf.d/policyflow-security-headers.conf;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- SPA fallback -------------------------------------------------------
    # Client-side routing means /quotes/<guid> has no file on disk. Serving
    # index.html lets React Router resolve the route; without this, a refresh on
    # any deep link returns 404.
    location / {
        include /etc/nginx/conf.d/policyflow-security-headers.conf;

        try_files $uri $uri/ /index.html;

        # The HTML shell must never be cached: it references hashed asset names,
        # so a stale shell would load assets that no longer exist.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
